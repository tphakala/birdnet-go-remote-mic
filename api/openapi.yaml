openapi: 3.1.0

info:
  title: birdnet-go-remote-mic management API
  version: 0.1.0
  summary: Management API for the BirdNET-Go remote microphone appliance.
  description: |
    Read and manage a birdnet-go-remote-mic appliance: appliance and
    per-device status, and a narrow slice of configuration.

    The API is served over HTTPS with a self-signed certificate generated
    and persisted by the appliance. Consumers are BirdNET-Go (generated Go
    client) and the appliance's own web UI (generated TypeScript types).

    Errors use RFC 9457 problem details (application/problem+json).

    Authentication: when the appliance has a shared access token configured
    (auth.token), every operation except /healthz requires it as an RFC
    6750 bearer credential (Authorization: Bearer <token>). A missing or
    wrong token yields 401 with a WWW-Authenticate: Bearer challenge and an
    RFC 9457 problem body (covered by each operation's default response).
    Without a configured token the appliance serves every operation
    unauthenticated (open access, the default), and the mDNS TXT record
    says auth=none rather than auth=token. The same token is the Digest
    password for the RTSP stream.

    Evolution policy: additive changes only within v1. Fields may be added
    to responses at any time; consumers must ignore unknown fields.
  license:
    name: MIT
    identifier: MIT
  contact:
    name: Tomi P. Hakala
    url: https://github.com/tphakala/birdnet-go-remote-mic

servers:
  - url: /api/v1
    description: The appliance itself (path-relative; host and port are deployment-specific).

tags:
  - name: system
    description: Appliance health and status.
  - name: devices
    description: Capture devices and their streams.
  - name: config
    description: Appliance configuration.
  - name: events
    description: Live event stream (Server-Sent Events).
  - name: notifications
    description: Appliance notifications (device, audio, stream, host and config events).

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [system]
      summary: Liveness probe
      description: >
        Always available and unauthenticated. Reports that the process is up
        and whether the other operations require the access token, so a
        client can ask for the token before making any gated request (the
        mDNS TXT record already advertises the same auth=token flag). Use
        /status for real state.
      security: []
      responses:
        "200":
          description: The appliance is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /status:
    get:
      operationId: getStatus
      tags: [system]
      summary: Appliance status
      description: >
        Appliance-level runtime state: version, uptime, RTSP listener,
        discovery, whether an access token is required, and per-device counts.
        Full per-device detail lives at /devices.
      responses:
        "200":
          description: Current appliance status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplianceStatus"
        default:
          $ref: "#/components/responses/Problem"

  /devices:
    get:
      operationId: listDevices
      tags: [devices]
      summary: List capture devices
      description: >
        Every configured device with its configured and negotiated
        parameters and runtime state, including devices that failed to open
        (state "skipped") or died after startup (state "failed").
      responses:
        "200":
          description: All configured devices.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: provisionDevice
      tags: [devices]
      summary: Enable (provision) a detected capture device
      description: >
        Enables streaming on a capture device the host exposes but the
        configuration does not yet list. The appliance derives a unique name
        from the device's hardware label, generates a hard-to-guess RTSP path,
        and chooses a mode, sample rate and channel count from the device's
        probed capabilities (Opus 48 kHz mono when supported, otherwise raw PCM
        at the device's best rate). Any field set in the request overrides its
        derived default. The change is persisted and hot-applied to the running
        pipeline; the new device starts serving without a restart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisionDeviceRequest"
      responses:
        "201":
          description: The device was provisioned and is being served.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "404":
          description: No such capture device is present on the host.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: >
            The device is already configured: by this exact id or derived name,
            or under another id (the host lists it but the available view hides
            it, for example a card index that resolves to it).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The request is well-formed but fails validation.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
        default:
          $ref: "#/components/responses/Problem"

  /devices/available:
    get:
      operationId: listAvailableDevices
      tags: [devices]
      summary: List detected but unconfigured capture devices
      description: >
        Every capture device the host exposes that the configuration does not
        yet list, with the sample rates and channel counts probed for it. These
        are the devices an operator can enable from the web UI without editing
        the configuration by hand.
      responses:
        "200":
          description: All detected, unconfigured devices.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailableDevice"
        default:
          $ref: "#/components/responses/Problem"

  /devices/{name}:
    get:
      operationId: getDevice
      tags: [devices]
      summary: Get one capture device
      description: The named device with its configuration and runtime state.
      parameters:
        - name: name
          in: path
          required: true
          description: The device's configured unique name.
          schema:
            type: string
      responses:
        "200":
          description: The named device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteDevice
      tags: [devices]
      summary: Remove a configured capture device
      description: >
        Removes the named device from the configuration, stopping it if it is
        serving and returning its hardware to the pool of available devices. The
        change is persisted and hot-applied without a restart.
      parameters:
        - name: name
          in: path
          required: true
          description: The device's configured unique name.
          schema:
            type: string
      responses:
        "204":
          description: The device was removed.
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /events:
    get:
      operationId: streamEvents
      tags: [events]
      summary: Live event stream
      description: |
        A single multiplexed Server-Sent Events stream for the whole
        appliance. Each SSE event's `event:` field names its type and its
        `data:` field is a JSON document:

        - `levels`: emitted at a fixed cadence (10 Hz) with one
          LevelsEvent covering every serving device. Peak and RMS are
          measured over the window since the previous event; meter
          ballistics (decay, peak hold) are the client's job.
        - `notification`: emitted when a notification is raised, with one
          Notification as data. The stream is best effort: there is no replay,
          `Last-Event-ID` is ignored, and a client re-syncs from GET
          /notifications on connect, on reconnect, and whenever it detects an
          id gap.
        - `heartbeat`: emitted every 15 seconds with `{}` as data, so
          idle connections stay alive and clients can detect a dead
          server. Sent as a named event (not an SSE comment) so simple
          fetch-based parsers see it.

        Further event types will be added additively; clients must ignore
        event types they do not know. Level data is ephemeral: there is no
        replay and `Last-Event-ID` is ignored.

        Browser note: the native EventSource API cannot send an
        Authorization header, so an authenticated web client should
        consume this endpoint with fetch and a streamed response body.

        OpenAPI 3.1 cannot type per-event payloads on a stream; the
        `data:` schema for `levels` events is LevelsEvent. This operation
        moves to OpenAPI 3.2 `itemSchema` once the code generators
        support it.
      parameters:
        - name: events
          in: query
          required: false
          description: >
            Event types to subscribe to, comma-separated. Absent means
            all types. Heartbeats are always sent.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              examples: [levels]
      responses:
        "200":
          description: The event stream; stays open until the client disconnects.
          content:
            text/event-stream:
              schema:
                type: string
                description: >
                  SSE framing per the HTML living standard. The data field
                  of each `levels` event is a JSON LevelsEvent.
        default:
          $ref: "#/components/responses/Problem"

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications
      description: >
        The current notification snapshot: the boot identity, the server's
        wall-clock time and uptime read at one instant, the ring depth, the
        next id that will be assigned, and every discrete
        history entry still in the ring merged with every active condition (even
        ones the ring has trimmed), in ascending id order. Clients bootstrap and
        re-sync from this; the /events stream is best effort, so a gap in
        streamed ids means a dropped event and the client refetches here. The
        ring keeps the most recent 500 history entries in memory only: there is
        no time-based expiry, and a restart (a new bootId) starts it empty. A
        full snapshot runs to about 165 KB of JSON, so the response is
        gzip-compressed when the request's Accept-Encoding allows it.
      responses:
        "200":
          description: The current notification snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSnapshot"
        default:
          $ref: "#/components/responses/Problem"

  /config:
    get:
      operationId: getConfig
      tags: [config]
      summary: Get the running configuration
      description: >
        The configuration as loaded (defaults applied). This includes the
        shared access token, which only an authenticated caller can read (this
        route is behind the bearer gate when a token is set); the Access
        Control card needs it to show what to paste into BirdNET-Go.
      responses:
        "200":
          description: The active configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: patchConfig
      tags: [config]
      summary: Update configuration
      description: >
        Validates and persists a partial configuration update to the config
        file. Changes are applied to the running appliance in place when
        possible (a token or discovery change, and adding, removing or
        restarting a device); `restartRequired` in the response reports the
        exception, when a change could only be persisted and needs a restart
        to take effect.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigPatch"
      responses:
        "200":
          description: The update was validated and persisted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigUpdateResult"
        "400":
          description: The patch is malformed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The patch is well-formed but fails validation.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
        default:
          $ref: "#/components/responses/Problem"

  /system:
    get:
      operationId: getSystem
      tags: [system]
      summary: Host system information
      description: >
        Static hardware facts (platform, CPU, total memory and storage) and
        live host metrics (CPU and memory use, SoC temperature where a sensor
        exists), plus per-interface network details, for the web UI's host
        panel.
      responses:
        "200":
          description: Host system information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
        default:
          $ref: "#/components/responses/Problem"

  /system/restart:
    post:
      operationId: postSystemRestart
      tags: [system]
      summary: Request an appliance restart
      description: >
        Requests a graceful shutdown and restart of the appliance process.
        The server responds 202 Accepted, flushes in-flight responses, and
        initiates a graceful exit.
      responses:
        "202":
          description: Restart request accepted; shutdown is initiating.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestartResult"
        default:
          $ref: "#/components/responses/Problem"

  /system/certificate:
    get:
      operationId: getSystemCertificate
      tags: [system]
      summary: Management TLS certificate metadata
      description: >
        Public metadata for the certificate the management listener presents:
        subject, issuer, whether it is self-signed, its subject alternative
        names, its validity window, and its SHA-256 fingerprint. Never returns
        private key material. Use it to verify the certificate before trusting
        it, and /system/certificate/pem to import it into a client trust store.
      responses:
        "200":
          description: Current management certificate metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateInfo"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: putSystemCertificate
      tags: [system]
      summary: Install a custom management TLS certificate
      description: >
        Replace the management listener's certificate with an operator-supplied
        certificate and private key. The pair is validated first (the key matches
        the certificate, it is currently valid, it carries a subject alternative
        name, and it is usable for server authentication); nothing is written on a
        validation failure. On success the pair is persisted to the certificate
        directory and served to new TLS connections at once, without a restart;
        connections already open keep the previous certificate until they
        reconnect. The installed certificate is pinned, so the appliance never
        regenerates it automatically. The private key is never returned by any
        endpoint. A browser may warn on its next load until the new certificate is
        trusted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertificateInstallRequest"
      responses:
        "200":
          description: The installed certificate's metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateInfo"
        "422":
          description: The certificate or key failed validation.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
        default:
          $ref: "#/components/responses/Problem"

  /system/certificate/pem:
    get:
      operationId: getSystemCertificatePem
      tags: [system]
      summary: Download the management TLS certificate (PEM)
      description: >
        The management listener's certificate, PEM-encoded, so an operator can
        import it into a client trust store. This is the public certificate
        only; the private key is never exposed.
      responses:
        "200":
          description: The PEM-encoded public certificate.
          content:
            application/x-pem-file:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"

  /system/certificate/regenerate:
    post:
      operationId: regenerateSystemCertificate
      tags: [system]
      summary: Regenerate the self-signed management certificate
      description: >
        Generate a fresh self-signed certificate for the management listener and
        serve it to new TLS connections at once, without a restart. It always
        covers the auto-detected names (loopback, the hostname, the
        hostname.local mDNS name, and the LAN IP addresses); any extraSans are
        added on top. This replaces a previously installed custom certificate and
        clears its pin, returning the appliance to self-managed certificates.
        Connections already open keep the previous certificate until they
        reconnect, and a browser may warn on its next load until the new
        certificate is trusted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertificateRegenerateRequest"
      responses:
        "200":
          description: The regenerated certificate's metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateInfo"
        "422":
          description: An extra SAN entry was not a valid DNS name or IP address.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
        default:
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        The appliance's shared access token (auth.token in the
        configuration). Enforced on every operation except /healthz once a
        token is configured; the mDNS TXT record advertises auth=token or
        auth=none accordingly. The same token is the Digest password for
        the RTSP stream.

  responses:
    Problem:
      description: An RFC 9457 problem detail.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Health:
      type: object
      description: Liveness probe response.
      required: [status, version, authRequired]
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
          description: Appliance build version.
          examples: ["v0.3.0"]
        authRequired:
          type: boolean
          description: True when every other operation requires the access token.
          examples: [true]

    ApplianceStatus:
      type: object
      description: Appliance-level runtime state.
      required:
        - version
        - uptimeSeconds
        - rtspListen
        - discoveryEnabled
        - authRequired
        - devicesServing
        - devicesTotal
      properties:
        version:
          type: string
          description: Appliance build version (set at build time).
        uptimeSeconds:
          type: integer
          format: int64
          minimum: 0
          description: Seconds since the process started.
        rtspListen:
          type: string
          description: The RTSP listener address (host:port as configured).
          examples: [":8554"]
        discoveryEnabled:
          type: boolean
          description: Whether mDNS/DNS-SD advertisement is on.
        authRequired:
          type: boolean
          description: >
            Whether a shared access token is configured, so the API, web
            UI and RTSP stream require credentials.
        devicesServing:
          type: integer
          minimum: 0
          description: Devices currently capturing and serving their track.
        devicesTotal:
          type: integer
          minimum: 0
          description: Devices in the configuration, whatever their state.
        overrides:
          type: array
          description: >
            Serve-time CLI flag overrides in force for this run. Each entry
            names a config field whose effective (running) value differs from
            the persisted config file value because a serve flag (--listen,
            --mgmt-listen, --cert-dir, --management, --discovery) overrode it.
            Absent or empty when no serve overrides are active.
          items:
            $ref: "#/components/schemas/ConfigOverride"

    ConfigOverride:
      type: object
      description: >
        One config field overridden by a serve CLI flag for this run. The
        effective value is in force now; the persisted value is what the config
        file holds and what a restart without the flag would use.
      required: [field, effective, persisted]
      properties:
        field:
          type: string
          description: Dotted config path of the overridden field.
          examples: ["listen", "management.listen"]
        effective:
          type: string
          description: Value in force for this run (from the serve flag).
        persisted:
          type: string
          description: Value stored in the config file.

    CertificateInfo:
      type: object
      description: >
        Public metadata for the management listener's TLS certificate. Never
        includes private key material.
      required:
        - subject
        - issuer
        - selfSigned
        - dnsNames
        - ipAddresses
        - notBefore
        - notAfter
        - fingerprintSha256
        - managed
      properties:
        subject:
          type: string
          description: Certificate subject distinguished name.
          examples: ["CN=birdnet-go-remote-mic"]
        issuer:
          type: string
          description: Certificate issuer distinguished name.
        selfSigned:
          type: boolean
          description: Whether the certificate is self-signed (subject equals issuer).
        dnsNames:
          type: array
          description: Subject alternative name DNS entries.
          items:
            type: string
        ipAddresses:
          type: array
          description: Subject alternative name IP entries.
          items:
            type: string
        notBefore:
          type: string
          format: date-time
          description: Start of the certificate validity window.
        notAfter:
          type: string
          format: date-time
          description: End of the certificate validity window.
        fingerprintSha256:
          type: string
          description: SHA-256 fingerprint of the DER certificate, colon-separated uppercase hex.
          examples: ["AB:CD:EF"]
        managed:
          type: boolean
          description: >
            Whether the appliance manages this certificate (a self-signed
            certificate it generated and will regenerate on an address change or
            expiry). False when an operator installed a custom certificate, which
            the appliance then never replaces automatically.

    CertificateInstallRequest:
      type: object
      description: >
        A custom certificate and its private key to install on the management
        listener. Validated before anything is written; on success the pair is
        persisted and served to new TLS connections without a restart. The
        private key is write-only and never returned by any endpoint.
      required:
        - certPem
        - keyPem
      properties:
        certPem:
          type: string
          maxLength: 65536
          description: >
            PEM-encoded certificate, leaf first, with any intermediate chain
            certificates after it. Must carry at least one subject alternative
            name and be valid now (not expired and not before its start).
          examples: ["-----BEGIN CERTIFICATE-----\n...\n-----END CERTIFICATE-----\n"]
        keyPem:
          type: string
          format: password
          maxLength: 16384
          description: >
            PEM-encoded unencrypted private key matching the certificate (PKCS#8,
            PKCS#1 RSA, or SEC1 EC). Write-only: never returned by any endpoint.

    CertificateRegenerateRequest:
      type: object
      description: >
        Options for regenerating the self-signed management certificate. The
        regenerated certificate always covers the auto-detected names (loopback,
        the hostname, the hostname.local mDNS name, and the LAN IP addresses);
        extraSans adds further names on top.
      properties:
        extraSans:
          type: array
          maxItems: 32
          description: >
            Extra DNS names or IP addresses to add to the subject alternative
            names, for names the auto-detection cannot see.
          items:
            type: string
            maxLength: 253

    Device:
      type: object
      description: >
        One configured capture device: its configuration, what capture
        actually negotiated, and its runtime state.
      required:
        - name
        - device
        - path
        - mode
        - format
        - state
        - rate
        - channels
        - clientConnected
        - droppedFrames
      properties:
        name:
          type: string
          description: Unique device name (also the DNS-SD instance name).
          examples: [garden]
        device:
          type: string
          description: >
            Configured capture device id. A stable id names the physical device
            and survives reboots: a USB unit by vendor, product and serial follows
            it to any port, while the by-port form (a USB unit with no serial) and
            the alsa-lib hw:CARD= form survive a replug into the same port. A
            card-index id such as hw:1,0 is accepted but can name a different
            device after a reboot (see idStable).
          examples: ["usb:1235:8218:s=S1A2B3:if=0,0", "hw:CARD=Loopback,DEV=1"]
        hwAddr:
          type: string
          description: >
            Current-boot ALSA address the configured id resolved to, for
            display. Absent when the id names no present hardware. It changes
            across reboots and replugs and is never persisted.
          examples: ["hw:4,0"]
        idStable:
          type: boolean
          description: >
            False when the configured id names a card by its kernel index
            (hw:N,D), which the kernel assigns in probe order, so the id can
            point at a different device after a reboot or replug.
          examples: [true]
        path:
          type: string
          description: RTSP path serving this device.
          examples: [/garden]
        mode:
          $ref: "#/components/schemas/StreamMode"
        format:
          type: string
          const: s16
          description: Sample format (only S16LE is supported).
        rate:
          type: integer
          minimum: 8000
          maximum: 384000
          description: Requested capture sample rate in Hz (as configured).
        channels:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: integer
            minimum: 1
            maximum: 8
          description: >
            Selected 1-based capture channel numbers to stream, ascending and
            unique (e.g. [1], [1, 2], or [1, 3]). The stream carries these
            channels in order; a single-channel selection yields a mono stream.
            Opus accepts one channel (mono) or two (stereo); PCM L16 carries any
            selection.
        streamedChannels:
          type: array
          maxItems: 8
          items:
            type: integer
            minimum: 1
            maximum: 8
          description: >
            Every 1-based capture channel that at least one of the device's
            streams carries, ascending and unique: the union of the stream
            selections, where channels describes only the first stream. The
            UI marks these channels as live on the level meters.
          examples: [[1], [1, 3]]
        opus:
          $ref: "#/components/schemas/OpusSettings"
        state:
          $ref: "#/components/schemas/DeviceState"
        negotiatedRate:
          type: integer
          description: >
            Sample rate the hardware actually delivers. Absent unless the
            device opened (the appliance refuses a rate mismatch, so when
            present it equals rate).
        negotiatedChannels:
          type: integer
          description: Channel count the hardware actually delivers. Absent unless the device opened.
        negotiatedFormat:
          type: string
          description: >
            Hardware capture sample format the device negotiated, as a short
            token (s16, s24_le, s24_3le, or s32). Absent unless the device
            opened. The stream is always delivered as S16LE, so a wider capture
            format means the audio is downconverted to 16-bit; this surfaces
            that reduction.
        clientConnected:
          type: boolean
          description: >
            Whether an RTSP session currently holds this track's single
            slot. Always false for skipped or failed devices.
        droppedFrames:
          type: integer
          format: int64
          minimum: 0
          description: >
            Frames dropped because the connected client was not keeping
            up. Zero for devices that never served.
        error:
          type: string
          description: Why the device is skipped or failed. Absent when serving.
        friendlyName:
          type: string
          description: >
            Human-facing label derived from the sound card name (the text
            before the first comma). Absent when the device id resolved to no
            present hardware, or the derived label is empty. The UI uses it
            to default a blank name.
          examples: ["Scarlett 2i2 USB"]
        supportedRates:
          type: array
          items:
            type: integer
          description: >
            Sample rates the hardware accepts, from the last successful probe
            (re-probed each time the device is opened, and retained across a
            transiently-unprobeable open). Absent or empty when no probe has
            succeeded (device missing or busy), in which case the UI offers a
            static list of common rates.
          examples: [[48000, 96000, 192000]]
        supportedChannels:
          type: array
          items:
            type: integer
          description: >
            Channel counts the hardware accepts, from the last successful probe
            (re-probed each time the device is opened) via the same non-blocking
            capability query as supportedRates. Absent or empty when no probe has
            succeeded (device missing or busy), in which case the UI offers a
            mono/stereo default. The UI takes the largest count as the number of
            selectable channels and builds the per-channel selection control
            (Ch1..ChN) from it.
          examples: [[2], [1, 2], [2, 4]]
        streams:
          type: array
          description: >
            Per-stream runtime state, one entry per stream fanned out from this
            device's shared capture. Present only while the device is serving.
            The device-level clientConnected and droppedFrames aggregate these
            (any client connected; summed drops), so a client that predates
            fan-out can ignore this array. A single-stream device carries one
            entry mirroring the device-level fields.
          items:
            $ref: "#/components/schemas/StreamStatus"

    StreamStatus:
      type: object
      description: One stream's runtime state within a serving device.
      required: [path, clientConnected, droppedFrames]
      properties:
        path:
          type: string
          description: RTSP path serving this stream.
          examples: [/garden]
        clientConnected:
          type: boolean
          description: Whether an RTSP session currently holds this stream's single slot.
        droppedFrames:
          type: integer
          format: int64
          minimum: 0
          description: >
            Audio dropped for this stream because its client or encoder was not
            keeping up. Zero when it never fell behind.

    DeviceState:
      type: string
      enum: [serving, skipped, failed, disabled]
      description: >
        serving: capturing and available over RTSP. skipped: not opened (the
        device is not connected, its id matches several devices, it resolves to
        hardware another entry already captures from, or the open failed); error
        says why. failed: died after opening; its RTSP path returns 404 until the
        device restarts. disabled: configured but intentionally not opened (its
        enabled flag is false); not captured or streamed until re-enabled, which
        is hot-applied without a restart. Recovery of a skipped or failed device:
        one bound by a stable id that could not be opened, or failed, while
        still present is retried automatically with a growing delay; one that
        was unplugged restarts when it is reconnected; a card-index id restarts
        only on a config save.

    AvailableDevice:
      type: object
      description: >
        A capture device the host exposes that the configuration does not yet
        list. It carries only the device id and the probed capabilities; a
        name, path and stream parameters are assigned when it is provisioned
        (see POST /devices).
      required:
        - device
        - state
      properties:
        device:
          type: string
          description: >
            Capture device id to persist, as provisioning stores it. It is a
            stable id that survives reboots (a serial-form id follows the unit to
            any port; a by-port or hw:CARD= id survives a replug into the same
            port), unless idStable is false.
          examples: ["usb:1235:8218:s=S1A2B3:if=0,0"]
        hwAddr:
          type: string
          description: Current-boot ALSA address of the device, for display only.
          examples: ["hw:4,0"]
        idStable:
          type: boolean
          description: >
            False when the host offered no stable id for this device (for example
            no sysfs in a minimal container, or a USB device with neither a serial
            nor a derivable port), in which case device is a card index that can
            change across reboots.
          examples: [true]
        state:
          type: string
          const: available
          description: Always "available"; the device is detected but not configured.
        friendlyName:
          type: string
          description: Human-facing label derived from the sound card name.
          examples: ["Scarlett 2i2 USB"]
        supportedRates:
          type: array
          items:
            type: integer
          description: >
            Sample rates the hardware accepts, verified with a real HW_PARAMS
            commit. Absent or empty when the device could not be probed.
          examples: [[48000, 96000, 192000]]
        supportedChannels:
          type: array
          items:
            type: integer
          description: >
            Channel counts the hardware accepts. Absent or empty when the device
            could not be probed. The UI takes the largest count as the number of
            selectable channels (Ch1..ChN).
          examples: [[2], [1, 2], [2, 4]]

    ProvisionDeviceRequest:
      type: object
      description: >
        Request to enable (provision) a detected capture device. Only device is
        required; the appliance derives sensible defaults for everything else,
        and any field set here overrides its derived default.
      required:
        - device
      properties:
        device:
          type: string
          maxLength: 2048
          description: Capture device id to enable, as reported by GET /devices/available.
          examples: ["usb:1235:8218:s=S1A2B3:if=0,0"]
        name:
          type: string
          maxLength: 128
          description: Optional unique device name; derived from the hardware label when omitted.
        mode:
          $ref: "#/components/schemas/StreamMode"
        rate:
          type: integer
          minimum: 8000
          maximum: 384000
          description: Optional capture sample rate in Hz; chosen from the device's capabilities when omitted.
        channels:
          type: array
          maxItems: 8
          items:
            type: integer
            minimum: 1
            maximum: 8
          description: >
            Optional 1-based channel selection to stream, ascending and unique.
            When omitted the appliance selects a single channel: it captures
            briefly from the device and picks the loudest channel (the lowest
            numbered among channels within 1 dB of the loudest, and channel 1
            when all are near silence or the measurement fails). An empty array
            is treated the same as omitting the field (so no minItems is
            imposed).

    StreamMode:
      type: string
      enum: [pcm, opus]
      description: >
        pcm streams raw L16 at the capture rate (the ultrasonic path);
        opus streams 48 kHz Opus, mono or stereo (one or two channels; the
        normal-audio path).

    OpusSettings:
      type: object
      description: Opus encoder settings, used only when mode is opus.
      properties:
        bitrate:
          type: integer
          minimum: 0
          maximum: 510000
          description: >
            Encoder bitrate in bits per second; 0 selects the default of 128
            kbps per channel carried (128 kbps mono, 256 kbps stereo), capped
            at the 510 kbps Opus maximum. An explicit value above 510000 is
            rejected.

    LevelsEvent:
      type: object
      description: >
        The payload of one `levels` SSE event: audio levels for every
        serving device, measured over the window since the previous event.
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/DeviceLevels"

    DeviceLevels:
      type: object
      description: >
        One device's audio levels over the last measurement window, one
        entry per captured channel. A mono device carries a single-element
        channels array; a stereo (or higher) device carries one entry per
        interleaved channel.
      required: [name, channels]
      properties:
        name:
          type: string
          description: The device's configured unique name.
          examples: [garden]
        channels:
          type: array
          description: Per-channel levels, ordered by capture channel index.
          items:
            $ref: "#/components/schemas/ChannelLevels"

    ChannelLevels:
      type: object
      description: One capture channel's audio levels over the last window.
      required: [channel, peakDbfs, rmsDbfs, clipped]
      properties:
        channel:
          type: integer
          minimum: 0
          description: Zero-based capture channel index.
          examples: [0]
        peakDbfs:
          type: number
          format: double
          minimum: -99
          maximum: 0
          description: >
            Peak sample level in dBFS over the window. Silence is clamped
            to the -99 floor.
          examples: [-12.4]
        rmsDbfs:
          type: number
          format: double
          minimum: -99
          maximum: 0
          description: >
            RMS level in dBFS over the window, clamped to the -99 floor.
          examples: [-27.9]
        clipped:
          type: boolean
          description: Whether any sample in the window hit full scale.

    NotificationSeverity:
      type: string
      enum: [error, warning, info]
      description: >
        error is a fault needing attention; warning is a degraded state; info
        is routine. Only error notifications raise a client toast.

    NotificationCategory:
      type: string
      enum: [device, audio, stream, system, config]
      description: The subsystem a notification concerns.

    NotificationKind:
      type: string
      enum: [event, onset, clear]
      description: >
        event is a discrete one-off; onset marks a condition becoming active and
        clear marks it becoming inactive, paired by key.

    Notification:
      type: object
      description: One notification entry.
      required: [id, bootId, time, uptimeMs, severity, category, kind, title, message]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: Monotonic per-boot id, assigned in publish order.
          examples: [42]
        bootId:
          type: string
          description: >
            Identity of the process run that produced this entry. Ids restart at
            1 each boot, so a client resets its read state when bootId changes.
          examples: ["4a2b1c8e9f0d3e5a"]
        time:
          type: string
          format: date-time
          description: >
            When the entry was published (appliance wall clock). An appliance
            without a real-time clock can step this clock by hours when NTP
            first syncs, so entries published before the step carry a wrong
            time; uptimeMs does not have that problem.
          examples: ["2026-09-12T11:03:00Z"]
        uptimeMs:
          type: integer
          format: int64
          minimum: 0
          description: >
            Milliseconds since the notification center started (early in
            process startup), read from a monotonic clock that a wall-clock
            step does not move. The difference between two entries' uptimeMs
            is the true time between them, and the snapshot's uptimeMs gives
            the uptime at a known moment, so a client can place any entry
            relative to when it received the snapshot.
          examples: [93500]
        severity:
          $ref: "#/components/schemas/NotificationSeverity"
        category:
          $ref: "#/components/schemas/NotificationCategory"
        kind:
          $ref: "#/components/schemas/NotificationKind"
        key:
          type: string
          description: >
            Condition identity, present on onset and clear entries and absent on
            discrete events. A clear pairs with its onset by key.
          examples: ["device:garden:down"]
        source:
          type: string
          description: The subject (device name, RTSP path, or remote address).
          examples: [garden]
        title:
          type: string
          description: Short noun label.
          examples: ["Device failed"]
        message:
          type: string
          description: One-sentence detail naming the specific device, path or value.

    NotificationSnapshot:
      type: object
      description: The full current notification state a client bootstraps and re-syncs from.
      required: [bootId, serverTime, uptimeMs, capacity, nextId, notifications]
      properties:
        bootId:
          type: string
          description: Identity of the current process run.
          examples: ["4a2b1c8e9f0d3e5a"]
        serverTime:
          type: string
          format: date-time
          description: >
            The appliance's wall-clock time when the snapshot was taken. It is
            informational: an appliance without a real-time clock can step it,
            so place entries in time from uptimeMs rather than from wall times.
          examples: ["2026-09-12T11:03:00Z"]
        uptimeMs:
          type: integer
          format: int64
          minimum: 0
          description: >
            The notification center's uptime in milliseconds at the same
            instant as serverTime. An entry happened (uptimeMs minus the entry's uptimeMs)
            milliseconds before the snapshot, whatever its wall-clock time says.
          examples: [120000]
        capacity:
          type: integer
          minimum: 1
          description: >
            How many history entries the ring keeps. Ids below nextId minus
            capacity have been trimmed, except onsets of conditions that are
            still active, which stay pinned.
          examples: [500]
        nextId:
          type: integer
          format: int64
          minimum: 1
          description: >
            The id the next published notification will take. A streamed id at or
            beyond a previously seen nextId with earlier ids missing means a
            dropped event; the client refetches this snapshot.
          examples: [43]
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
          description: History and active conditions, ascending by id.

    Config:
      type: object
      description: The appliance configuration (defaults applied).
      required: [listen, discovery, management, auth, notifications, devices]
      properties:
        listen:
          type: string
          description: RTSP listener address (host:port).
        discovery:
          $ref: "#/components/schemas/DiscoverySettings"
        management:
          $ref: "#/components/schemas/ManagementSettings"
        auth:
          $ref: "#/components/schemas/AuthSettings"
        notifications:
          $ref: "#/components/schemas/NotificationSettings"
        devices:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/DeviceConfig"

    DeviceConfig:
      type: object
      description: >
        The configuration of one device, without runtime state. A device opens
        one capture and fans it out into one or more streams. The flat path,
        mode, channels and opus fields describe the device's FIRST stream, so a
        client that predates fan-out still configures a single-stream device;
        the full set is in streams. On a PATCH, a body carrying streams is
        authoritative and the flat fields are ignored; a body omitting streams
        defines a single stream from the flat fields, and is rejected when it
        would collapse an existing multi-stream device. The maxLength limits on
        name, device and path apply to values a write introduces; a value
        already in the config file (which loads without them) may exceed them
        in a response.
      required: [name, device, path, mode, rate, channels, format]
      properties:
        name:
          type: string
          maxLength: 128
        device:
          type: string
          maxLength: 2048
        path:
          type: string
          maxLength: 128
        mode:
          $ref: "#/components/schemas/StreamMode"
        rate:
          type: integer
          minimum: 8000
          maximum: 384000
        channels:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: integer
            minimum: 1
            maximum: 8
          description: >
            Selected 1-based capture channel numbers to stream, ascending and
            unique (e.g. [1], [1, 2], or [1, 3]).
        format:
          type: string
          const: s16
        opus:
          $ref: "#/components/schemas/OpusSettings"
        enabled:
          type: boolean
          description: >
            Whether this device is captured and streamed; defaults to true
            when absent. Set false to keep it configured but not opened. A
            change is hot-applied without a restart.
        quietAlert:
          type: boolean
          description: >
            Whether this device raises the very-quiet audio condition; defaults
            to true when absent. Set false for a device expected to be silent
            for long stretches (a bat microphone by day). Stuck-at-zero and
            clipping conditions are unaffected.
        streams:
          type: array
          minItems: 1
          maxItems: 8
          description: >
            The streams fanned out from this device's shared capture, one RTSP
            path each. When present it is authoritative and the flat
            path/mode/channels/opus fields are ignored (they mirror streams[0]
            for older clients). One capture is opened per device, so every
            stream shares the device rate and format.
          items:
            $ref: "#/components/schemas/StreamConfig"

    StreamConfig:
      type: object
      description: >
        One stream fanned out from a device's shared capture: a subset of the
        device's channels, encoded in one mode, served at one RTSP path.
      required: [path, mode, channels]
      properties:
        path:
          type: string
          maxLength: 128
          description: RTSP path serving this stream; unique across every device's streams. The maxLength applies to a path a write introduces (see DeviceConfig).
          examples: [/garden]
        mode:
          $ref: "#/components/schemas/StreamMode"
        channels:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: integer
            minimum: 1
            maximum: 8
          description: >
            Selected 1-based capture channel numbers this stream carries,
            ascending and unique (e.g. [1], [1, 2], or [1, 3]). Opus accepts one
            channel (mono) or two (stereo); PCM L16 carries any selection.
        opus:
          $ref: "#/components/schemas/OpusSettings"

    DiscoverySettings:
      type: object
      description: mDNS/DNS-SD advertisement settings.
      properties:
        enabled:
          type: boolean
          description: >
            mDNS/DNS-SD advertisement; defaults to true when absent. In a
            patch, an absent field (including an empty discovery object) leaves
            discovery unchanged, mirroring AuthSettings.token.

    AuthSettings:
      type: object
      description: >
        Shared access token settings. The one token gates the management
        API and web UI (bearer) and the RTSP stream (Digest password).
      properties:
        token:
          type: string
          description: >
            The shared access token: 12 to 128 characters from the URL
            unreserved set [A-Za-z0-9._~-], or empty for open access. In a
            patch, an absent field leaves the token unchanged and an empty
            string disables authentication. Reads return the configured
            value (empty when open) to the authenticated caller.
          pattern: "^(|[A-Za-z0-9._~-]{12,128})$"
          examples: ["k7Qm3vX9pL2wR8nT"]

    ManagementSettings:
      type: object
      description: HTTPS management API settings.
      properties:
        enabled:
          type: boolean
          description: Whether the management API is served; defaults to true when absent.
        listen:
          type: string
          description: HTTPS listen address (host:port); defaults to :8443.
          examples: [":8443"]
        certDir:
          type: string
          description: >
            Directory where the self-signed certificate and key are
            persisted; defaults to the config file's directory.

    NotificationSettings:
      type: object
      description: >
        Condition-monitor settings behind the notification center. In a read
        every field is materialized to its effective value; in a patch an absent
        field (or an absent nested object) leaves the current value unchanged, so
        a partial block like {"host":{"cpuPercent":95}} touches only that field.
      properties:
        enabled:
          type: boolean
          description: >
            Whether the condition monitors run; defaults to true when absent.
            Disabling them stops the audio-signal and host-health conditions but
            leaves device-failure, client and config events publishing.
        audio:
          $ref: "#/components/schemas/AudioAlertSettings"
        host:
          $ref: "#/components/schemas/HostAlertSettings"

    AudioAlertSettings:
      type: object
      description: Audio-signal condition thresholds.
      properties:
        quietDbfs:
          type: integer
          minimum: -99
          maximum: -1
          description: Peak level below which the input counts as very quiet (dBFS). Default -60.
        quietSeconds:
          type: integer
          minimum: 10
          maximum: 86400
          description: Seconds below quietDbfs before the very-quiet warning raises. Default 600.
        zeroSeconds:
          type: integer
          minimum: 5
          maximum: 3600
          description: Seconds at digital zero before the no-signal warning raises. Default 30.
        clipPercent:
          type: integer
          minimum: 1
          maximum: 100
          description: Percentage of clipped windows within the clip window that raises the clipping warning. Default 20.
        clipWindowSeconds:
          type: integer
          minimum: 1
          maximum: 600
          description: Window in seconds over which clipping is measured. Default 10.

    HostAlertSettings:
      type: object
      description: >
        Host-health condition thresholds. Each clear threshold must sit below
        its onset to keep a hysteresis gap (a clear at or above the onset would
        chatter the condition).
      properties:
        cpuPercent:
          type: integer
          minimum: 1
          maximum: 100
          description: CPU usage percent that raises the warning. Default 90.
        cpuClearPercent:
          type: integer
          minimum: 1
          maximum: 99
          description: CPU usage percent below which the warning clears; must be below cpuPercent. Default 75.
        tempCelsius:
          type: integer
          minimum: 30
          maximum: 120
          description: Temperature in Celsius that raises the warning. Default 80.
        tempClearCelsius:
          type: integer
          minimum: 1
          maximum: 119
          description: Temperature in Celsius below which the warning clears; must be below tempCelsius. Default 75.
        diskPercent:
          type: integer
          minimum: 1
          maximum: 100
          description: Disk-used percent that raises the warning. Default 90.
        diskClearPercent:
          type: integer
          minimum: 1
          maximum: 99
          description: Disk-used percent below which the warning clears; must be below diskPercent. Default 85.
        memFreePercent:
          type: integer
          minimum: 1
          maximum: 90
          description: Available-memory percent below which the warning raises. Default 10.
        memFreeMiB:
          type: integer
          minimum: 1
          maximum: 65536
          description: Available memory in MiB below which the warning raises. Default 64.

    ConfigPatch:
      type: object
      description: >
        A partial configuration update. Only the fields present are
        changed; the result must validate as a whole configuration.
      properties:
        discovery:
          $ref: "#/components/schemas/DiscoverySettings"
        auth:
          $ref: "#/components/schemas/AuthSettings"
        notifications:
          $ref: "#/components/schemas/NotificationSettings"
        devices:
          type: array
          description: >
            Replaces the whole device list when present (per-device merge
            is not supported). An empty array removes every device, matching
            Config.devices, which also imposes no minItems.
          maxItems: 32
          items:
            $ref: "#/components/schemas/DeviceConfig"

    ConfigUpdateResult:
      type: object
      description: Outcome of a persisted configuration update.
      required: [config, restartRequired]
      properties:
        config:
          $ref: "#/components/schemas/Config"
        restartRequired:
          type: boolean
          description: >
            True when the persisted change only takes effect after the
            appliance restarts.

    RestartResult:
      type: object
      description: Acknowledgement that a restart request was accepted.
      required: [status]
      properties:
        status:
          type: string
          description: Status message confirming restart initiation.
          examples: ["restarting"]

    Problem:
      type: object
      description: RFC 9457 problem details.
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference

    ValidationProblem:
      description: A problem detail carrying per-field validation errors.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                required: [field, reason]
                properties:
                  field:
                    type: string
                    description: Dotted path of the invalid field.
                    examples: ["devices[0].rate"]
                  reason:
                    type: string

    SystemInfo:
      type: object
      description: Host hardware facts and live system metrics.
      required:
        - platform
        - hostname
        - cpuCores
        - memTotalBytes
        - memUsedBytes
        - diskTotalBytes
        - diskUsedBytes
        - network
      properties:
        platform:
          type: string
          description: Go platform tag, GOOS/GOARCH.
          examples: ["linux/arm64"]
        os:
          type: string
          description: Operating system pretty name (from /etc/os-release).
          examples: ["Debian GNU/Linux 13 (trixie)"]
        kernel:
          type: string
          description: Kernel release string.
          examples: ["6.6.20+rpt-rpi-2712"]
        hostname:
          type: string
          description: The host's name.
          examples: ["birdmic"]
        cpuModel:
          type: string
          description: CPU or SoC model as reported by the kernel.
          examples: ["Raspberry Pi Zero 2 W Rev 1.0"]
        cpuCores:
          type: integer
          minimum: 1
          description: Number of logical CPUs.
        cpuPercent:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: >
            Host CPU utilization across all cores, as a percentage, averaged
            over the window between the server's two latest CPU readings. The
            readings are shared by all clients; a request less than a second
            after the latest one reuses its figure. The window is at most 30
            seconds long: when the latest reading is older than that, the
            server samples for a quarter second before responding. Absent only
            when the host's CPU counters cannot be read or give no basis for a
            ratio.
        memTotalBytes:
          type: integer
          format: int64
          minimum: 0
          description: Total physical memory in bytes.
        memUsedBytes:
          type: integer
          format: int64
          minimum: 0
          description: Used physical memory in bytes (total minus available).
        diskTotalBytes:
          type: integer
          format: int64
          minimum: 0
          description: Total bytes of the filesystem holding the appliance's data.
        diskUsedBytes:
          type: integer
          format: int64
          minimum: 0
          description: Used bytes of that filesystem.
        tempCelsius:
          type: number
          format: double
          description: >
            SoC or CPU temperature in degrees Celsius. Absent when no thermal
            sensor is exposed (typical off Raspberry Pi hardware).
        network:
          type: array
          description: Non-loopback network interfaces.
          items:
            $ref: "#/components/schemas/NetworkInterface"

    NetworkInterface:
      type: object
      description: One network interface and its live byte counters.
      required: [name, up, addresses, rxBytes, txBytes]
      properties:
        name:
          type: string
          examples: ["eth0"]
        mac:
          type: string
          description: Hardware (MAC) address; absent for interfaces without one.
          examples: ["dc:a6:32:00:11:22"]
        up:
          type: boolean
          description: Whether the interface is up and running.
        addresses:
          type: array
          description: Assigned IP addresses in CIDR notation.
          items:
            type: string
        rxBytes:
          type: integer
          format: int64
          minimum: 0
          description: Bytes received since boot.
        txBytes:
