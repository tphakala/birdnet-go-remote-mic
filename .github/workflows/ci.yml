name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.27'
  GOLANGCI_LINT_VERSION: 'v2.13.2'
  NODE_VERSION: '26'
  # Pinned to the version the Taskfile is developed against, so CI and a local
  # `task check` cannot interpret the same file differently.
  TASK_VERSION: '3.53.1'

permissions:
  contents: read

# The appliance is a Linux-only ALSA capture + RTSP server, so CI runs on Linux.
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      # web/dist is generated (not tracked) and only the web job builds it, so
      # these Go-only jobs build with -tags skipfrontend, selecting the web
      # embed stub. That keeps them Node-free; the web job compiles the real
      # go:embed against a freshly built web/dist.
      - name: Build (CGO disabled)
        run: CGO_ENABLED=0 go build -tags skipfrontend ./...
      - name: Build (linux/arm64, CGO disabled)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags skipfrontend ./...
      - name: Build (linux/arm 32-bit, CGO disabled)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=6 go build -tags skipfrontend ./...
      - name: Test with coverage
        run: go test -race -tags skipfrontend -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false

  vet:
    name: Vet
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64, arm, '386']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run go vet
        env:
          GOARCH: ${{ matrix.goarch }}
          GOARM: '6' # ignored for non-arm arches; matches the arm build target
          CGO_ENABLED: '0' # vet the pure-Go, CGO-off build like the rest of CI
        # skipfrontend selects the web embed stub so vet needs no compiled web/dist.
        run: go vet -tags skipfrontend ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$files"
            exit 1
          fi
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  # web/dist is generated by `task web:build` (tsc) and embedded via go:embed;
  # it is not tracked in git. The Go jobs above build with -tags skipfrontend
  # and never touch web/, so this is the one job that compiles the front end and
  # then the real embed against it. It needs both Node (to build the UI) and Go
  # (to prove the go:embed build succeeds with the freshly generated web/dist).
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      # Running the real Taskfile rather than re-listing its commands here: a
      # copy would drift from the local gate, and the drift would be invisible
      # until CI passed something `task check` would have caught, or the reverse.
      - name: Install Task
        run: npm install --global @go-task/cli@${{ env.TASK_VERSION }}
      - name: Check AGENTS.md sizes
        run: task agents:size
      # web:verify runs, in order: tsc --noEmit, oxlint, the html-validate
      # accessibility audit (task web:a11y), the node:test suite (which includes
      # the WCAG token-contrast tests), and finally a rebuild of web/dist.
      - name: Verify web UI (type-check, lint, a11y, tests, build)
        run: task web:verify
      # task build depends on web:build, so this rebuilds web/dist and compiles
      # the real go:embed (no skipfrontend tag) against it: the check that the
      # embedded UI actually builds into the binary.
      - name: Build binary with embedded web UI
        run: task build:amd64
      # The Go test/vet/lint jobs build with -tags skipfrontend and so analyze
      # the embed stub, never the real web/embed.go. web/dist exists here (the
      # build step above generated it), so vet the real embed variant too.
      - name: Vet the real embed (no skipfrontend tag)
        run: go vet ./web/
