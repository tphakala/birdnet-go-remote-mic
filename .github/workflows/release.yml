name: release

on:
  push:
    tags:
      - 'v*'
  # Manual runs are gated to a v* tag ref by the job `if` below: a dispatch on a
  # branch ref is skipped, not run and failed inside goreleaser (which refuses an
  # untagged commit). Dispatch on a v* tag to cut a release manually.
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '26'
  # Pinned to the version the Taskfile is developed against, so the release
  # web build and a local `task check` cannot interpret the same file differently.
  TASK_VERSION: '3.53.1'

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    # goreleaser can only release from a tag. The push trigger already filters to
    # v* tags; this also guards workflow_dispatch, so a manual run on a branch ref
    # is skipped instead of failing partway through the release.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags: goreleaser derives the version and changelog
          # from them.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The release binary embeds the web UI, so the goreleaser `before` hook runs
      # `task web:build` (tsc) before compiling. That needs Node and Task on PATH.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Task
        run: npm install --global @go-task/cli@${{ env.TASK_VERSION }}
      # Quick pre-release gate. The full race + web suite already ran on this
      # commit when it landed on main (a tag is cut from main); this is cheap
      # insurance that the tagged tree still builds and passes unit tests.
      - name: Test before release
        run: task test
      # The release manifest (manifest.json + manifest.json.sig) is signed after
      # GoReleaser publishes, so check the signing key first: a missing secret,
      # or a key absent from internal/releasemanifest/keys.go, fails here before
      # anything is published rather than leaving a live release without a
      # manifest that update checks can verify. It also rejects a tag that is not
      # a v-prefixed semantic version, which the manifest would refuse later.
      # Only a release that is not older than the current latest becomes
      # "latest", where update checks fetch the manifest; .goreleaser.yaml reads
      # MAKE_LATEST. No latest release yet (gh fails) means this one is.
      - name: Decide whether this release becomes latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          latest=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          make_latest=$(go run ./tools/releasemanifest make-latest -tag "$TAG" -latest "$latest")
          echo "latest release: ${latest:-none}; make $TAG latest: $make_latest"
          echo "MAKE_LATEST=$make_latest" >> "$GITHUB_ENV"
      - name: Check the release manifest signing key
        env:
          RELEASE_MANIFEST_KEY: ${{ secrets.RELEASE_MANIFEST_KEY }}
          TAG: ${{ github.ref_name }}
        run: go run ./tools/releasemanifest check-key -tag "$TAG"
      # GoReleaser's brews step pushes the regenerated formula to the tap over
      # SSH. Prime the runner's known_hosts with GitHub's key so that push cannot
      # hang or fail on host-key verification, rather than relying on an
      # undocumented checkout side effect.
      - name: Add github.com to known_hosts
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      # SHA-pinned: this job holds contents: write, so a moving tag on a third-party
      # action is a supply-chain risk. Dependabot updates the SHA pin. (# v7.2.3)
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Scoped write deploy key for tphakala/homebrew-tap; goreleaser's brews
          # step pushes the regenerated formula over SSH with it (no PAT needed).
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      # Write and sign the release manifest from GoReleaser's dist/ output (it
      # cross-checks every archive digest against checksums.txt), attach it to
      # the release, then download what was published and verify it with the
      # keys compiled into the tool, exactly as an appliance will. Until the
      # upload lands the release has no manifest; update checks treat that like
      # any other failed check and try again later. (Publishing a draft first is
      # no better: the Homebrew formula is pushed regardless and would point at
      # draft downloads that 404 until the draft is published.) If this fails after
      # publishing, rerun it by hand: `go run ./tools/releasemanifest generate`
      # against the same dist/, then `gh release upload`.
      - name: Publish the signed release manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_MANIFEST_KEY: ${{ secrets.RELEASE_MANIFEST_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          go run ./tools/releasemanifest generate -tag "$TAG" -dist dist
          gh release upload "$TAG" dist/manifest.json dist/manifest.json.sig --clobber
          mkdir -p published
          gh release download "$TAG" --pattern 'manifest.json*' --dir published --clobber
          go run ./tools/releasemanifest verify -dist published
