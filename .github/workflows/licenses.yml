name: Licenses

# Keeps THIRD_PARTY_LICENSES.md in step with what the binary actually links
# (tools/licensegen). It runs on every pull request, not only on go.mod
# changes: code can start linking a package from a module go.mod already lists
# without touching go.mod.
#
# - On a Dependabot pull request, a dependency bump is expected to change the
#   document, so the job regenerates it and commits the result to the PR
#   branch; no one has to do it by hand.
# - On every other pull request and on main, the job fails when the committed
#   document is stale (run `task licenses:generate`) or when a linked module
#   ships no license file.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.27'

permissions:
  contents: read

jobs:
  licenses:
    name: Third-party licenses
    runs-on: ubuntu-latest
    # Writing back to the PR branch needs contents: write; only the Dependabot
    # path uses it, and it only touches THIRD_PARTY_LICENSES.md.
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # For a Dependabot pull request, check out the branch itself (not the
          # merge commit) so the regenerated file can be committed back to it.
          # Everything else, fork pull requests included, keeps the default ref.
          ref: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.ref || '' }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Regenerate for a Dependabot pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
        run: |
          go run ./tools/licensegen
          if git diff --quiet -- THIRD_PARTY_LICENSES.md; then
            echo "THIRD_PARTY_LICENSES.md is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add THIRD_PARTY_LICENSES.md
          git commit -m "deps: update third-party licenses"
          git push

      - name: Verify
        if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
        run: go run ./tools/licensegen -check
