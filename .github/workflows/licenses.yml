name: Licenses

# Keeps THIRD_PARTY_LICENSES.md in step with what the binary actually links
# (tools/licensegen). It runs on every pull request, not only on go.mod
# changes: code can start linking a package from a module go.mod already lists
# without touching go.mod.
#
# - On a Dependabot pull request, a dependency bump is expected to change the
#   document, so the regenerate job rewrites it and commits the result to the
#   PR branch; no one has to do it by hand. That commit is pushed with the
#   workflow token, which by design starts no new workflow runs, so it carries
#   no checks of its own; it only changes the generated document, and the
#   dependency bump itself was checked on the commit before it.
# - On every other pull request and on main, the verify job fails when the
#   committed document is stale (run `task licenses:generate`), or when a
#   linked module ships no license file or one the generator cannot name.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.27'

permissions:
  contents: read

# On a pull request, a newer push supersedes a run still in flight, so a
# regenerate job rarely races a branch that moved (and if it does, git rejects
# the non-fast-forward push). Keyed on the PR number, since branch names repeat
# across forks. Runs on main are never cancelled, so every main commit keeps a
# result.
concurrency:
  group: licenses-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Third-party licenses
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Verify
        run: go run ./tools/licensegen -check

  regenerate:
    name: Third-party licenses (Dependabot)
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    # The only job with write access, and it only commits the generated file.
    permissions:
      contents: write
    steps:
      - name: Checkout the pull request branch
        uses: actions/checkout@v7
        with:
          # The branch itself, not the merge commit, so the regenerated file
          # can be committed back to it.
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Regenerate and commit
        run: |
          go run ./tools/licensegen
          if git diff --quiet -- THIRD_PARTY_LICENSES.md; then
            echo "THIRD_PARTY_LICENSES.md is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add THIRD_PARTY_LICENSES.md
          git commit -m "deps: update third-party licenses"
          git push
