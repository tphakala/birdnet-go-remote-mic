# GoReleaser builds the tagged release: Linux amd64/arm64 tarballs, .deb
# packages, and the Homebrew formula in tphakala/homebrew-tap. Run by
# .github/workflows/release.yml on a v* tag. Dry-run locally with
# `goreleaser release --snapshot --clean`. Note `goreleaser check` exits
# nonzero here solely on the deprecated-`brews` warning (see the brews note
# below); the release job runs `release`, where that is only a warning.
version: 2
project_name: birdnet-go-remote-mic

# The release binary embeds the web UI via go:embed (web/embed.go, built WITHOUT
# the skipfrontend tag), so web/dist must exist before the Go build. `task
# web:build` compiles the TypeScript and syncs the static assets into web/dist.
# web/dist is architecture-independent, so building it once here covers every
# target. Running the real Taskfile task (not a re-listed copy of its commands)
# keeps this in step with CI and a local `task check`.
before:
  hooks:
    - task web:build

builds:
  - id: remote-mic
    # The command users run is `remote-mic`; the archive, deb, and formula all
    # ship it under that name even though the repo is birdnet-go-remote-mic.
    binary: remote-mic
    main: ./cmd/remotemic
    # Pure-Go appliance: no cgo, so these are static binaries that cross-compile
    # cleanly for arm64 on the amd64 runner.
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      # Profile-guided optimization. The committed cmd/remotemic/default.pgo is
      # named by explicit path (not -pgo=auto, which silently builds WITHOUT PGO
      # when the profile is absent) so a release fails loudly rather than shipping
      # a non-PGO binary if the profile ever goes missing. The path is relative to
      # the module root, where goreleaser runs the build. The profile is
      # GOARCH-independent, so one profile guides the amd64, arm64, and arm builds.
      - -pgo=cmd/remotemic/default.pgo
    # main.version is the ldflags target the binary prints (cmd/remotemic/main.go:
    # `var version = "dev"`), surfaced by `remote-mic version`. {{ .Tag }} (not
    # {{ .Version }}, which strips the leading v) keeps the released version
    # string v-prefixed, matching what `git describe --tags` stamps in a local
    # `task build`.
    ldflags:
      - -s -w -X main.version={{ .Tag }}
    # Linux only: the appliance is an ALSA capture + RTSP server (cmd/remotemic
    # is //go:build linux). amd64, arm64, and 32-bit arm.
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    # GOARM=6 (ARMv6) matches the Taskfile's build:arm target: a static pure-Go
    # ARMv6 binary runs on every 32-bit Pi, from the Pi Zero / Zero W / 1 up
    # through the Pi 4, so a single arm build covers the older devices.
    goarm:
      - "6"

archives:
  # e.g. birdnet-go-remote-mic_1.0.0_linux_amd64.tar.gz, containing the
  # remote-mic binary plus the README, its license and notice, and the licenses of the
  # third-party code linked into it (their terms require the notices to travel
  # with the binary).
  - formats: [tar.gz]
    files:
      - README.md
      - LICENSE
      - NOTICE
      - THIRD_PARTY_LICENSES.md

# checksums.txt is also the cross-check for the signed release manifest:
# tools/releasemanifest (run by the release workflow after this config) refuses
# to sign a manifest whose archive digests disagree with it.
checksum:
  name_template: checksums.txt

# A tag with a prerelease suffix (v1.3.0-rc.1) is published as a GitHub
# prerelease, so it never becomes "latest": the release manifest that update
# checks fetch from releases/latest/download/ stays on the newest stable release.
# A stable release becomes "latest" only when it is not older than the current
# one: the release workflow decides with `releasemanifest make-latest` and
# passes MAKE_LATEST, so a tag cut on an older line (v1.2.5 after v1.3.0) does
# not move update checks backwards. Unset (a local run) keeps the default.
release:
  prerelease: auto
  make_latest: '{{ if index .Env "MAKE_LATEST" }}{{ .Env.MAKE_LATEST }}{{ end }}'

changelog:
  use: github
  filters:
    exclude:
      - '^ci:'
      - '^docs?:'
      - '^README'

# .deb packages for amd64 and arm64. Binary only, by design: the installed
# binary sets up its own hardened systemd service (dedicated user, unit, state
# dirs) via `remote-mic service install`, so the package ships no unit file and
# starts nothing on `apt install`. It installs /usr/bin/remote-mic and the docs.
nfpms:
  - id: remote-mic
    package_name: birdnet-go-remote-mic
    vendor: Tomi P. Hakala
    homepage: "https://github.com/tphakala/birdnet-go-remote-mic"
    # GitHub noreply address, so no personal email is baked into published debs.
    maintainer: "Tomi P. Hakala <tphakala@users.noreply.github.com>"
    description: |-
      Remote microphone appliance for BirdNET-Go.
      Captures local ALSA audio and serves it over RTSP/RTP for BirdNET-Go to pull.
      After install, run `sudo remote-mic service install` to run it at boot.
    license: Apache-2.0
    formats:
      - deb
    bindir: /usr/bin
    section: sound
    contents:
      - src: README.md
        dst: /usr/share/doc/birdnet-go-remote-mic/README.md
      - src: LICENSE
        # Debian convention (and lintian) expect the license file at .../copyright.
        dst: /usr/share/doc/birdnet-go-remote-mic/copyright
      - src: NOTICE
        dst: /usr/share/doc/birdnet-go-remote-mic/NOTICE
      - src: THIRD_PARTY_LICENSES.md
        dst: /usr/share/doc/birdnet-go-remote-mic/THIRD_PARTY_LICENSES.md

# Homebrew tap: on every tagged release, GoReleaser regenerates the formula in
# tphakala/homebrew-tap and pushes it over SSH, so the tap stays current with no
# manual steps. Auth is a scoped write deploy key (secret HOMEBREW_TAP_DEPLOY_KEY),
# not a personal access token, so its reach is limited to that one repo.
#
# Kept as a formula (`brews`), not a cask: casks are macOS-only and this ships
# Linux binaries, so a formula lets `brew install` work on Linux (Homebrew on
# Linux). GoReleaser deprecated `brews` but it stays functional in v2, and the
# release job runs `release`, not `check`, so the deprecation only warns.
brews:
  - name: birdnet-go-remote-mic
    repository:
      owner: tphakala
      name: homebrew-tap
      branch: main
      git:
        url: "git@github.com:tphakala/homebrew-tap.git"
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}"
    directory: Formula
    # A prerelease (rc) tag leaves the formula alone, as it leaves "latest".
    skip_upload: auto
    homepage: "https://github.com/tphakala/birdnet-go-remote-mic"
    description: "Remote microphone appliance for BirdNET-Go (ALSA capture served over RTSP)"
    license: Apache-2.0
    caveats: |
      This installs the `remote-mic` command. To run it at boot as a hardened
      systemd service (creates a dedicated user, unit, and state directories):
        sudo remote-mic service install
    # `remote-mic version` prints and exits 0; a bare invocation would default to
    # `serve` and start the appliance, so the test names the subcommand.
    test: |
      system "#{bin}/remote-mic", "version"
