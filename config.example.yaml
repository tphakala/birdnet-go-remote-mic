# birdnet-go-remote-mic example configuration.
listen: ":8554"             # RTSP listen address shared by all streams (host:port)
discovery:
  enabled: true             # advertise each device over mDNS/DNS-SD (_rtsp._tcp); default true
management:
  enabled: true             # serve the HTTPS management API and (later) web UI; default true
  listen: ":8443"           # HTTPS listen address (host:port); default :8443
  cert_dir: ""              # where to persist the self-signed cert/key; default: the config file's directory
                            # NOTE: the API is currently UNAUTHENTICATED. Token auth is coming; until then,
                            # set enabled: false if the appliance is on an untrusted network.
devices:
  - name: garden-mic        # DNS-SD instance name and log label; must be unique
    device: "hw:1,0"        # go-audio-capture device id (see -list-devices)
    path: /garden           # RTSP path of this stream; must be unique; default /stream
    mode: opus              # "pcm" (raw L16, any rate, for ultrasonic) or "opus" (48 kHz mono)
    rate: 48000             # capture sample rate in Hz; must be 48000 when mode is opus
    channels: [1]           # 1-based channel selection, e.g. [1], [1, 2], or [1, 3]
    format: s16             # only s16 is supported for now
    opus:
      bitrate: 64000        # Opus bitrate in bps; 0 uses the encoder default
  - name: ultrasonic-mic
    device: "hw:2,0"
    path: /bat
    mode: pcm
    rate: 256000
    channels: [1]
    format: s16
