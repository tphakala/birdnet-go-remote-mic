# https://taskfile.dev
version: '3'

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  LDFLAGS: -s -w -X main.version={{.VERSION}}

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # Every target writes an arch-suffixed binary; there is deliberately no bare
  # bin/remote-mic, so an out-of-date `scp bin/remote-mic`
  # fails loudly instead of silently shipping the amd64 dev build to an ARM Pi.
  build:amd64:
    desc: Build for linux/amd64 dev host, CGO off, version stamped (bin/remote-mic-amd64)
    aliases: [build]
    # Build the web UI first so go:embed bakes in a fresh dist. web/dist is not
    # tracked in git, so an untagged Go build embeds whatever web:build emits here.
    deps: [web:build]
    env:
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: amd64
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o bin/remote-mic-amd64 ./cmd/remotemic

  build:arm64:
    desc: Cross-build for linux/arm64, the Pi Zero 2 W target (bin/remote-mic-arm64)
    deps: [web:build]
    env:
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: arm64
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o bin/remote-mic-arm64 ./cmd/remotemic

  build:arm:
    desc: Cross-build for linux/arm, 32-bit older Pis, GOARM=6 for ARMv6 reach (bin/remote-mic-arm)
    deps: [web:build]
    env:
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: arm
      GOARM: '6'
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o bin/remote-mic-arm ./cmd/remotemic

  test:
    desc: Run all tests
    env:
      CGO_ENABLED: '0'
    # skipfrontend selects the web embed stub, so tests build without a compiled
    # web/dist (which is untracked and may be absent on a clean checkout).
    cmds:
      - go test -tags skipfrontend ./...

  test:race:
    desc: Run tests with the race detector
    cmds:
      - go test -race -tags skipfrontend ./...

  vet:
    desc: Run go vet for the supported 64-bit and 32-bit architectures
    env:
      CGO_ENABLED: '0' # vet the pure-Go, CGO-off build
      GOARM: '6' # ignored for non-arm arches; matches the arm build target
    # skipfrontend selects the web embed stub so vet needs no compiled web/dist.
    cmds:
      - GOARCH=amd64 go vet -tags skipfrontend ./...
      - GOARCH=arm64 go vet -tags skipfrontend ./...
      - GOARCH=arm go vet -tags skipfrontend ./...
      - GOARCH=386 go vet -tags skipfrontend ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  api:generate:
    desc: Regenerate the management API code from the OpenAPI spec
    cmds:
      - go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0 -config api/oapi-codegen.yaml api/openapi.yaml

  api:lint:
    desc: Lint the OpenAPI spec with vacuum
    cmds:
      - go run github.com/daveshanley/vacuum@v0.30.1 lint -d -e api/openapi.yaml

  licenses:generate:
    desc: Regenerate THIRD_PARTY_LICENSES.md from the modules linked into the binary and the bundled fonts
    cmds:
      - go run ./tools/licensegen

  licenses:verify:
    desc: Fail if THIRD_PARTY_LICENSES.md is stale, or a linked module has no license file or an unrecognized one
    cmds:
      - go run ./tools/licensegen -check

  api:verify:
    desc: Fail if the generated API code is stale relative to the spec
    cmds:
      - go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0 -config api/oapi-codegen.yaml api/openapi.yaml
      - |
        if ! git diff --quiet -- internal/mgmtapi/gen.go; then
          echo "internal/mgmtapi/gen.go is out of date; run: task api:generate"
          exit 1
        fi

  fmt:
    desc: Fail if any Go file is not gofmt-formatted
    cmds:
      - |
        files=$(gofmt -l .)
        if [ -n "$files" ]; then
          echo "These files are not gofmt-formatted (run: gofmt -w .):"
          echo "$files"
          exit 1
        fi

  tidy:
    desc: Tidy and verify go.mod
    cmds:
      - go mod tidy
      - go mod verify

  web:build:
    desc: Compile web UI TypeScript and sync static assets into web/dist
    # web/dist is architecture-independent, and build:amd64/arm64/arm each depend
    # on this task. `run: once` builds it a single time per `task` invocation
    # (e.g. `task check`) instead of once per arch. Standalone `task web:build`
    # or `task build:arm64` is still a fresh invocation, so it always rebuilds.
    run: once
    cmds:
      # Clean first so a renamed or deleted source file cannot leave a stale
      # artifact behind in the embedded output.
      - rm -rf web/dist
      - npx -p typescript@7.0.2 tsc -p web/tsconfig.json
      - cp -r web/static/* web/dist/

  web:typecheck:
    desc: Type-check web UI TypeScript without emitting
    cmds:
      - npx -p typescript@7.0.2 tsc -p web/tsconfig.json --noEmit

  web:lint:
    desc: Lint web UI TypeScript and JavaScript
    cmds:
      - npx -p oxlint@1.80.0 oxlint --deny-warnings web/src

  web:a11y:
    desc: Audit HTML markup and accessibility rules
    cmds:
      - npx -p html-validate@11.10.0 html-validate -c web/.htmlvalidate.json web/static/index.html

  web:test:
    desc: Compile and run the pure notification-core unit tests (node:test)
    cmds:
      # A second tsconfig emits src + test to web/.test-out preserving structure,
      # so the compiled test resolves ../src/... the same as the source tree. The
      # package.json pins ESM resolution for node --test. Zero new dependencies.
      # Clean first (like web:build) so a renamed or deleted test cannot leave a
      # stale compiled file behind that node --test would still run.
      - rm -rf web/.test-out
      - npx -p typescript@7.0.2 tsc -p web/tsconfig.test.json
      - printf '{"type":"module"}' > web/.test-out/package.json
      - node --test web/.test-out/test/

  web:verify:
    desc: Type-check, lint, a11y-audit, unit-test, and rebuild the web UI
    # web/dist is generated, not tracked, so there is no committed artifact to
    # drift from: this just proves the front end type-checks, lints, passes the
    # a11y audit and its unit tests, and compiles cleanly into web/dist. The
    # binary-build steps (task build:*) then verify go:embed against that output.
    cmds:
      - task: web:typecheck
      - task: web:lint
      - task: web:a11y
      - task: web:test
      - task: web:build

  agents:size:
    desc: Fail if any AGENTS.md exceeds 20 KB
    cmds:
      # agy silently truncates each instruction file at about 24 KB, dropping
      # whatever rules sit at the tail. The 20 KB cap leaves headroom.
      - |
        fail=0
        for f in $(git ls-files --cached --others --exclude-standard '*AGENTS.md'); do
          size=$(wc -c < "$f")
          if [ "$size" -gt 20480 ]; then
            echo "$f is $size bytes (limit 20480); split it into module AGENTS.md files"
            fail=1
          fi
        done
        exit $fail

  check:
    desc: Full local gate (agents size, build, arm64 + arm builds, vet, lint, api checks, third-party licenses, web verify, fmt, race tests)
    cmds:
      - task: agents:size
      - task: web:verify
      - task: build:amd64
      - task: build:arm64
      - task: build:arm
      - task: vet
      - task: lint
      - task: api:lint
      - task: api:verify
      - task: licenses:verify
      - task: fmt
      - task: test:race
