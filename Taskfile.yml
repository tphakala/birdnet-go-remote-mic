# https://taskfile.dev
version: '3'

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  LDFLAGS: -s -w -X main.version={{.VERSION}}

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build the appliance binary (CGO disabled, version stamped)
    env:
      CGO_ENABLED: '0'
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o bin/birdnet-go-remote-mic ./cmd/birdnet-go-remote-mic

  build-arm64:
    desc: Cross-build for linux/arm64 (the Pi Zero 2 W target)
    env:
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: arm64
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o bin/birdnet-go-remote-mic-arm64 ./cmd/birdnet-go-remote-mic

  build-arm:
    desc: Cross-build for linux/arm (32-bit, older Pis; GOARM=6 for ARMv6 reach)
    env:
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: arm
      GOARM: '6'
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o bin/birdnet-go-remote-mic-arm ./cmd/birdnet-go-remote-mic

  test:
    desc: Run all tests
    env:
      CGO_ENABLED: '0'
    cmds:
      - go test ./...

  test:race:
    desc: Run tests with the race detector
    cmds:
      - go test -race ./...

  vet:
    desc: Run go vet for the supported 64-bit and 32-bit architectures
    cmds:
      - GOARCH=amd64 go vet ./...
      - GOARCH=arm64 go vet ./...
      - GOARCH=arm go vet ./...
      - GOARCH=386 go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  api:generate:
    desc: Regenerate the management API code from the OpenAPI spec
    cmds:
      - go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0 -config api/oapi-codegen.yaml api/openapi.yaml

  api:lint:
    desc: Lint the OpenAPI spec with vacuum
    cmds:
      - go run github.com/daveshanley/vacuum@v0.30.1 lint -d -e api/openapi.yaml

  api:verify:
    desc: Fail if the generated API code is stale relative to the spec
    cmds:
      - go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0 -config api/oapi-codegen.yaml api/openapi.yaml
      - |
        if ! git diff --quiet -- internal/mgmtapi/gen.go; then
          echo "internal/mgmtapi/gen.go is out of date; run: task api:generate"
          exit 1
        fi

  fmt:
    desc: Fail if any Go file is not gofmt-formatted
    cmds:
      - |
        files=$(gofmt -l .)
        if [ -n "$files" ]; then
          echo "These files are not gofmt-formatted (run: gofmt -w .):"
          echo "$files"
          exit 1
        fi

  tidy:
    desc: Tidy and verify go.mod
    cmds:
      - go mod tidy
      - go mod verify

  web:build:
    desc: Compile web UI TypeScript and sync static assets into web/dist
    cmds:
      # Clean first so a renamed or deleted source file cannot leave a stale
      # artifact behind in the embedded output.
      - rm -rf web/dist
      - npx -p typescript@7.0.2 tsc -p web/tsconfig.json
      - cp -r web/static/* web/dist/

  web:typecheck:
    desc: Type-check web UI TypeScript without emitting
    cmds:
      - npx -p typescript@7.0.2 tsc -p web/tsconfig.json --noEmit

  web:lint:
    desc: Lint web UI TypeScript and JavaScript
    cmds:
      - npx -p oxlint@1.80.0 oxlint --deny-warnings web/src

  web:a11y:
    desc: Audit HTML markup and accessibility rules
    cmds:
      - npx -p html-validate@11.10.0 html-validate -c web/.htmlvalidate.json web/static/index.html

  web:verify:
    desc: Fail if web/dist is out of date relative to web/src or web/static
    cmds:
      - task: web:typecheck
      - task: web:lint
      - task: web:a11y
      - task: web:build
      - |
        # Fail on any modified OR untracked file under web/dist (a freshly
        # emitted file is untracked and would slip past `git diff` alone).
        if [ -n "$(git status --porcelain -- web/dist)" ]; then
          echo "web/dist is out of date; run: task web:build"
          git status --porcelain -- web/dist
          exit 1
        fi

  check:
    desc: Full local gate (build, arm64 + arm builds, vet, lint, api checks, web verify, fmt, race tests)
    cmds:
      - task: web:verify
      - task: build
      - task: build-arm64
      - task: build-arm
      - task: vet
      - task: lint
      - task: api:lint
      - task: api:verify
      - task: fmt
      - task: test:race
